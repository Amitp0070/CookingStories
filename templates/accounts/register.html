<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <style>

        .container {
            padding-top: 10px;
        }
    </style>
</head>

<body>


    <div class="container">
        <div class="row">
            <div class="col-md-8 col-lg-4 mx-auto">
                <form method="post" class="card shadow-lg">
                    {% csrf_token %}
                    <div class="card-header text-center bg-dark text-light py-3">
                        <h3>Create New Account</h3>
                    </div>
                    {% include 'components/message.html' %}
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control " name="username" id="username"
                                aria-describedby="userHelp" placeholder="username" />
                            <small id="userHelp" class="form-text text-muted"></small>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control " name="email" id="email"
                                aria-describedby="emailHelpId" placeholder="abc@mail.com" />
                            <small id="emailHelpId" class="form-text text-muted"></small>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control " name="pass" id="pass"
                                aria-describedby="passHelp" placeholder="password" />
                            <small id="passHelp" class="form-text text-muted"></small>
                        </div>
                        <div class="mb-3">
                            <label for="cpassword" class="form-label">Confrim Password</label>
                            <input type="password" class="form-control " name="cpass" id="cpass"
                                aria-describedby="cpassHelp" placeholder="confirm password" />
                            <small id="cpassHelp" class="form-text text-muted"></small>
                        </div>
                        <div class="d-grid ">
                            <button class="btn btn-primary btn-lg">
                                Create account
                            </button>
                            <div class="p-3 d-flex fw-bold fs-5 mx-auto">
                                Already have account! <a href="{% url 'login' %}"
                                    class="nav-link text-primary px-2">Login</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</body>

</html>
